spring:
  application:
    name: ad-review-analyst
  datasource:
    url: jdbc:h2:file:./data/db/adreview;AUTO_SERVER=TRUE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  ai:
    mcp:
      client:
        enabled: true
        servers-configuration: classpath:mcp-servers.json
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-max
          temperature: 0.3

server:
  port: 8124
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true

ad-review:
  # 生产环境 Bearer Token 鉴权（未设置则跳过鉴权，开发模式）
  api-key: ${API_KEY:}
  roi-threshold: 1.5
  cpa-threshold: 100
  ctr-threshold: 1.0
  # ROI 异常诊断的最低消耗门槛（元），低于该消耗不判异常
  abnormal-min-cost: 100
  # 入选 TOP 计划的最低消耗门槛（元）
  top-campaign-min-cost: 200
  # 判定衰退计划的最低消耗门槛（元）
  declining-campaign-min-cost: 500
  # 判定高 CPA 的最小转化数
  cpa-min-conversions: 3
  # 判定低 CTR 的最小展示量
  ctr-min-impressions: 10000
  # 默认预算规划乘数
  budget-growth-factor: 1.1
  # 单计划消耗超过全场平均消耗的倍数阈值（预算超支检测）
  overspend-ratio-threshold: 2.5
  # 平均点击成本高于全场平均 CPC 的倍数阈值（素材衰退检测）
  creative-decay-cpc-multiplier: 1.5
  # 千川数据拉取/AI 调用失败时是否降级为模拟数据（生产环境建议 false）
  fallback-mock-on-error: true
  # 取数结果内存缓存 TTL（秒）
  cache-ttl-seconds: 300
  # 跨域允许来源（逗号分隔，默认 * 兼容开发；生产建议通过 CORS_ALLOWED_ORIGINS 收紧）
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  daily-report-cron: "0 0 9 * * ?"
  report-storage-path: ./data/reports

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"
