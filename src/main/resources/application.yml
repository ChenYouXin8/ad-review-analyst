spring:
  application:
    name: ad-review-analyst
  ai:
    mcp:
      client:
        enabled: true
        servers-configuration: classpath:mcp-servers.json
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-max
          temperature: 0.3
  security:
    api-key: ${API_KEY}

server:
  port: 8124
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true

ad-review:
  roi-threshold: 1.5
  cpa-threshold: 100
  ctr-threshold: 1.0
  daily-report-cron: "0 0 9 * * ?"
  report-storage-path: ./data/reports
